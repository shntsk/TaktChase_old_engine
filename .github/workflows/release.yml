name: Release

# Builds self-contained TaktChase packages and attaches them to a GitHub Release.
#
#   - Windows x64 : TaktChase-<tag>-win-x64.zip     (built on a Windows runner)
#   - Arch Linux  : TaktChase-<tag>-linux-x64.tar.gz (built inside an archlinux:latest container, x86_64)
#   - SHA256SUMS.txt covers both files.
#
# How to start it:
#   1. Push a tag, e.g.  git tag v0.1.0 && git push origin v0.1.0
#   2. Or run it manually from the Actions tab ("Run workflow") and type the tag name.
#
# This workflow does not run the tests. Tag a commit whose CI workflows are green.
# Nothing here validates OpenGL/Vulkan on a physical GPU.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create or update (for example v0.1.0)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  package-windows:
    name: Package (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Publish (self-contained, win-x64)
        shell: pwsh
        run: |
          $version = $env:TAG.TrimStart('v')
          dotnet publish TaktChase.Desktop/TaktChase.Desktop.csproj -c Release -r win-x64 --self-contained true `
            -p:Version=$version -o publish/win-x64
          if ($LASTEXITCODE -ne 0) { throw "dotnet publish failed" }

      - name: Check the published files
        shell: pwsh
        run: |
          foreach ($f in @("TaktChase.Desktop.exe", "osu.Framework.dll", "ppy.Veldrid.dll", "ppy.Veldrid.SPIRV.dll")) {
            if (-not (Test-Path "publish/win-x64/$f")) { throw "$f missing from publish/win-x64" }
          }
          Write-Host "Published files look complete."

      - name: Create the zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path "publish/win-x64/*" -DestinationPath "dist/TaktChase-$($env:TAG)-win-x64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: package-windows
          path: dist/*.zip
          if-no-files-found: error

  package-arch:
    name: Package (Arch Linux x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: archlinux:latest
    steps:
      - name: Install dependencies (pacman)
        run: pacman -Syu --noconfirm --needed git tar gzip dotnet-sdk-10.0

      - uses: actions/checkout@v7

      - name: Publish (self-contained, linux-x64)
        shell: bash
        run: |
          set -euo pipefail
          version="${TAG#v}"
          dotnet publish TaktChase.Desktop/TaktChase.Desktop.csproj -c Release -r linux-x64 --self-contained true \
            -p:Version="$version" -o publish/linux-x64

      - name: Check the published files
        shell: bash
        run: |
          set -euo pipefail
          for f in TaktChase.Desktop osu.Framework.dll ppy.Veldrid.dll ppy.Veldrid.SPIRV.dll; do
            [ -f "publish/linux-x64/$f" ] || { echo "::error::$f missing from publish/linux-x64"; exit 1; }
          done
          chmod +x publish/linux-x64/TaktChase.Desktop
          echo "Published files look complete."

      - name: Create the tar.gz
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          tar -C publish/linux-x64 -czf "dist/TaktChase-${TAG}-linux-x64.tar.gz" .

      - uses: actions/upload-artifact@v4
        with:
          name: package-arch
          path: dist/*.tar.gz
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: [package-windows, package-arch]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          sha256sum * | tee SHA256SUMS.txt

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          flags=""
          case "$TAG" in *-*) flags="--prerelease" ;; esac
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "TaktChase $TAG" --generate-notes $flags
          fi
