name: CI Android arm64-v8a

# Builds the Android application (TaktChase.Android) and uploads the debug APK as a workflow artifact.
#
# What this validates: the .NET Android workload installs, the Android project restores and compiles against the pinned
# osu-framework Android host (ppy.osu.Framework.Android 2026.1008.0), and a signed debug APK is produced for arm64-v8a.
# What it does NOT validate: that the app launches, renders, receives touches, keeps audio in sync or survives pause/resume.
# Those need a real device (see docs/android.md).
#
# TaktChase.Android is deliberately NOT part of TaktChase.sln, so the Arch and Windows workflows keep restoring and building
# the solution without the Android workload. The shared gameplay tests run in those workflows.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-android-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  ANDROID_PROJECT: TaktChase.Android/TaktChase.Android.csproj

jobs:
  build-apk:
    name: Build debug APK (arm64-v8a)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      # The .NET Android build tooling needs a JDK. 21 is the long-term-support release that current .NET Android versions accept.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Versions
        run: |
          dotnet --info
          java -version

      - name: Install the .NET Android workload
        run: dotnet workload install android

      - name: Installed workloads
        run: dotnet workload list

      - name: Restore
        run: dotnet restore "$ANDROID_PROJECT"

      # Installs the Android SDK packages the project needs into an isolated directory (nothing is skipped if a package is missing).
      - name: Install Android SDK dependencies
        run: |
          mkdir -p "$RUNNER_TEMP/android-sdk"
          dotnet build "$ANDROID_PROJECT" -t:InstallAndroidDependencies -f net10.0-android \
            "-p:AndroidSdkDirectory=$RUNNER_TEMP/android-sdk" \
            "-p:JavaSdkDirectory=$JAVA_HOME" \
            -p:AcceptAndroidSDKLicenses=True

      # SignAndroidPackage builds the project and then packages and debug-signs the APK.
      - name: Build debug APK
        run: |
          dotnet build "$ANDROID_PROJECT" -c Debug --no-restore -t:SignAndroidPackage \
            "-p:AndroidSdkDirectory=$RUNNER_TEMP/android-sdk" \
            "-p:JavaSdkDirectory=$JAVA_HOME"

      - name: Locate and inspect the APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t apks < <(find TaktChase.Android/bin -type f -name '*-Signed.apk')
          if [ "${#apks[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one *-Signed.apk under TaktChase.Android/bin, found ${#apks[@]}"
            find TaktChase.Android/bin -type f -name '*.apk' || true
            exit 1
          fi
          apk="${apks[0]}"
          echo "path=$apk" >> "$GITHUB_OUTPUT"
          ls -l "$apk"
          # Check the exact native audio dependencies needed by osu!framework, not just any .so file.
          entries="$(unzip -Z1 "$apk")"
          for library in libbass.so libbass_fx.so libbassmix.so; do
            if ! grep -Fxq "lib/arm64-v8a/$library" <<< "$entries"; then
              echo "::error::Required native audio library is missing from APK: lib/arm64-v8a/$library"
              exit 1
            fi
            echo "Verified native audio library: lib/arm64-v8a/$library"
          done
          if grep -Eq '^lib/(armeabi-v7a|x86|x86_64)/' <<< "$entries"; then
            echo "::error::Unexpected extra ABI in the APK"
            exit 1
          fi
          unzip -l "$apk" | tail -n 40

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: taktchase-android-debug-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 14
