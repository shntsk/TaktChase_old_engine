name: CI Windows x64

# Validates restore, build, and automated tests on Windows x64 (GitHub-hosted runner, Windows Server).
# There is no physical GPU on this runner: no graphics backend runs on real hardware here.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-windows-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  build-test:
    name: Build and test (Windows x64, no GPU)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: SDK information
        run: dotnet --info

      - name: Restore
        run: dotnet restore TaktChase.sln

      - name: Build (Release)
        run: dotnet build TaktChase.sln -c Release --no-restore

      - name: Verify that both rendering paths are in the build
        shell: pwsh
        run: |
          # OpenGL (GLRenderer) and Veldrid (Vulkan/D3D11) ship in the same ppy.osu.Framework package.
          $out = "TaktChase.Desktop/bin/Release/net10.0"
          if (-not (Test-Path "$out/osu.Framework.dll")) { throw "osu.Framework.dll missing in $out" }
          if (-not (Get-ChildItem $out -Filter "Veldrid*.dll")) { throw "Veldrid*.dll missing in $out" }
          Write-Host "osu.Framework.dll and Veldrid*.dll are present."

      - name: Test
        run: dotnet test TaktChase.sln -c Release --no-build --logger "console;verbosity=normal"

      - name: Coverage notice
        shell: pwsh
        run: Write-Host "CI validated compilation and headless tests. It did not validate OpenGL/Vulkan on a physical GPU."
