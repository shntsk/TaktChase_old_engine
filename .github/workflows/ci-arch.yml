name: CI Arch Linux x86_64

# Runs inside a REAL Arch Linux container (the official archlinux:latest image) with the .NET SDK
# from the official Arch repository (pacman). Note: the kernel is the host Ubuntu runner's kernel;
# what is validated is the Arch userspace (packages, glibc, toolchain), not an Arch installation on a machine.
# There is no physical GPU: no graphics backend runs on real hardware here.
#
# The package is "dotnet-sdk-10.0" (the versioned line in the extra repository), not the "dotnet-sdk"
# meta-package: global.json requires SDK 10.0.x, and the meta-package will move to a newer major version in the future.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-arch-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  build-test:
    name: Build and test (Arch Linux container, no GPU)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: archlinux:latest
    steps:
      - name: Install dependencies (pacman)
        run: pacman -Syu --noconfirm --needed git jq dotnet-sdk-10.0 alsa-lib alsa-plugins

      - uses: actions/checkout@v7

      - name: Installed versions
        run: |
          pacman -Qs '^dotnet'
          dotnet --info

      - name: Restore
        run: dotnet restore TaktChase.sln

      - name: Build (Release)
        run: dotnet build TaktChase.sln -c Release --no-restore

      - name: Verify that both rendering paths are in the build
        shell: bash
        run: |
          # What is checked (static evidence only; nothing here runs a renderer):
          #  1. osu.Framework.dll is in the output. GLRenderer (OpenGL) and VeldridRenderer (Vulkan/D3D11/Metal)
          #     are both compiled into this single assembly, so their type and namespace names must appear in
          #     its metadata strings.
          #  2. The generated TaktChase.Desktop.deps.json (the resolved runtime dependency graph) contains
          #     ppy.Veldrid and ppy.Veldrid.SPIRV as direct dependencies of ppy.osu.Framework, plus the Veldrid
          #     binding packages (ppy.Veldrid.OpenGLBindings, ppy.Veldrid.MetalBindings, ppy.Vk).
          #  3. Every managed runtime asset that deps.json lists for those packages exists in the output, and the
          #     native SPIR-V library listed for this RID exists under runtimes/.
          # File names are read from deps.json. The Veldrid assemblies are named "ppy.Veldrid*.dll" (the NuGet
          # package IDs), so a "Veldrid*.dll" glob can never match them.
          set -euo pipefail
          out="TaktChase.Desktop/bin/Release/net10.0"
          deps="$out/TaktChase.Desktop.deps.json"
          rid="linux-x64"
          fail() { echo "::error::$*"; exit 1; }

          [ -f "$out/osu.Framework.dll" ] || fail "osu.Framework.dll missing in $out"
          [ -f "$deps" ] || fail "$deps missing (resolved dependency graph was not generated)"

          for s in GLRenderer VeldridRenderer osu.Framework.Graphics.OpenGL osu.Framework.Graphics.Veldrid; do
            LC_ALL=C grep -aqF -- "$s" "$out/osu.Framework.dll" || fail "'$s' not found in osu.Framework.dll metadata"
            echo "osu.Framework.dll contains '$s'"
          done

          # Each package key in the resolved target looks like "<id>/<version>".
          pkg_key() {
            jq -r --arg id "$1" '.targets | to_entries[0].value | keys[] | select(startswith($id + "/"))' "$deps"
          }

          fw_key="$(pkg_key ppy.osu.Framework)"
          [ -n "$fw_key" ] || fail "ppy.osu.Framework is not in the resolved dependency graph"
          echo "Resolved: $fw_key"

          for id in ppy.Veldrid ppy.Veldrid.SPIRV; do
            jq -e --arg fw "$fw_key" --arg id "$id" \
              '.targets | to_entries[0].value[$fw].dependencies | has($id)' "$deps" > /dev/null \
              || fail "$id is not a dependency of $fw_key in $deps"
          done

          for id in ppy.Veldrid ppy.Veldrid.SPIRV ppy.Veldrid.OpenGLBindings ppy.Veldrid.MetalBindings ppy.Vk; do
            key="$(pkg_key "$id")"
            [ -n "$key" ] || fail "$id is not in the resolved dependency graph"
            assets="$(jq -r --arg k "$key" '.targets | to_entries[0].value[$k].runtime // {} | keys[]' "$deps")"
            [ -n "$assets" ] || fail "$key lists no managed runtime assets in deps.json"
            for asset in $assets; do
              f="$out/$(basename "$asset")"
              [ -f "$f" ] || fail "$key: runtime asset $asset not found as $f"
              echo "$key -> $f"
            done
          done

          spirv_key="$(pkg_key ppy.Veldrid.SPIRV)"
          natives="$(jq -r --arg k "$spirv_key" --arg rid "$rid" \
            '.targets | to_entries[0].value[$k].runtimeTargets // {} | to_entries[]
             | select(.value.rid == $rid and .value.assetType == "native") | .key' "$deps")"
          [ -n "$natives" ] || fail "$spirv_key lists no native asset for $rid in deps.json"
          for n in $natives; do
            [ -f "$out/$n" ] || fail "native asset $n for $rid not found in $out"
            echo "$spirv_key native ($rid) -> $out/$n"
          done

          echo "Both rendering paths are present: GLRenderer and VeldridRenderer in osu.Framework.dll, Veldrid runtime dependencies resolved and copied."

      - name: Headless audio environment (ALSA null device)
        run: |
          # The visual tests start a full framework host, which initializes BASS audio. osu.Framework asserts that BASS
          # reports at least 2 devices ("No sound" + the default device), which fails on a container with no ALSA
          # library and no sound card ("Bass did not provide any audio devices."). alsa-lib is installed above; this
          # step gives ALSA a "default" PCM that discards audio, so the host can initialize without hardware.
          # It changes only the CI environment; the tests and the game code are untouched.
          printf 'pcm.!default {\n  type null\n}\n' > /etc/asound.conf
          echo "--- /etc/asound.conf"; cat /etc/asound.conf
          echo "--- libasound"; ldconfig -p | grep -i libasound || echo "libasound NOT found"
          echo "--- sound cards"; cat /proc/asound/cards 2>/dev/null || echo "no sound cards (expected in CI)"

      - name: Test
        run: dotnet test TaktChase.sln -c Release --no-build --logger "console;verbosity=normal"

      - name: Coverage notice
        run: echo "CI validated compilation and headless tests on Arch userspace. It did not validate OpenGL/Vulkan on a physical GPU."
