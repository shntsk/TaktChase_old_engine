name: CI Arch Linux x86_64

# Executa dentro de um container Arch Linux REAL (imagem oficial archlinux:latest) com o .NET SDK
# do repositório oficial do Arch (pacman). Atenção: o kernel é o do runner Ubuntu hospedeiro;
# o que é validado é o userspace Arch (pacotes, glibc, toolchain), não um Arch instalado em máquina.
# Não há GPU física: nenhum backend gráfico é executado em hardware real aqui.
#
# O pacote é "dotnet-sdk-10.0" (linha versionada do repositório extra) e não o meta-pacote "dotnet-sdk":
# o global.json exige SDK 10.0.x, e o meta-pacote passará a ser outra versão maior no futuro.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-arch-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  build-test:
    name: Build e testes (container Arch Linux, sem GPU)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: archlinux:latest
    steps:
      - name: Instalar dependências (pacman)
        run: pacman -Syu --noconfirm --needed git dotnet-sdk-10.0

      - uses: actions/checkout@v7

      - name: Versões instaladas
        run: |
          pacman -Qs '^dotnet'
          dotnet --info

      - name: Restore
        run: dotnet restore TaktChase.sln

      - name: Build (Release)
        run: dotnet build TaktChase.sln -c Release --no-restore

      - name: Verificar que os dois caminhos de renderização estão no build
        run: |
          # OpenGL (GLRenderer) e Veldrid (Vulkan) vêm no mesmo pacote ppy.osu.Framework.
          out="TaktChase.Desktop/bin/Release/net10.0"
          test -f "$out/osu.Framework.dll" || { echo "osu.Framework.dll ausente em $out"; exit 1; }
          ls "$out"/Veldrid*.dll > /dev/null || { echo "Veldrid*.dll ausente em $out"; exit 1; }
          echo "osu.Framework.dll e Veldrid*.dll presentes."

      - name: Testes
        run: dotnet test TaktChase.sln -c Release --no-build --logger "console;verbosity=normal"

      - name: Aviso sobre cobertura
        run: echo "CI validou compilação e testes headless em userspace Arch. Não validou OpenGL/Vulkan em GPU física."
